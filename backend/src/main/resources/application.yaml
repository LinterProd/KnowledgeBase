spring:
  application:
    name: EventTest
  datasource:
    url: jdbc:postgresql://localhost:5432/rosgranstroy
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: knowledge_base

    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false
    schemas: knowledge_base
    default-schema: knowledge_base

